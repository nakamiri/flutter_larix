group 'br.com.devmagic.flutter_larix'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs project(':flutter_larix').file('libs')
        }
               maven {
                   url "${project(':flutter_larix').projectDir}/libs"
            }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace "br.com.devmagic.flutter_larix"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    lint {
        disable 'InvalidPackage'
    }
}
dependencies {
    implementation 'com.android.support:multidex:1.0.0'
    compileOnly files('libs/libstream-release.aar')
    compileOnly files('libs/libudpsender-release.aar')
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
}
